<!doctype html><meta charset="utf-8"><title>Kanto OCR smoke test</title>
<style>body{font:16px system-ui;padding:24px}pre{white-space:pre-wrap;background:#eee;padding:12px}</style>
<h1>OCR browser smoke test</h1><p id="status">Booting…</p><pre id="log"></pre>
<script src="../assets/tesseract.min.js"></script>
<script>
(async()=>{
 const status=document.querySelector('#status'), log=document.querySelector('#log');
 const say=s=>{status.textContent=s;log.textContent+=s+'\n';};
 try{
  say('Tesseract global: '+!!window.Tesseract);
  const c=document.createElement('canvas');c.width=1000;c.height=360;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#111';x.font='bold 76px Arial';x.fillText('BULBASAUR',40,120);x.fillText('67/130',40,240);
  const img=new Image();img.src=c.toDataURL('image/png');await img.decode();
  say('Image decode OK: '+img.naturalWidth+'x'+img.naturalHeight);
  const worker=await Tesseract.createWorker('eng',1,{
   workerPath:new URL('../assets/worker.min.js',location.href).href,
   corePath:new URL('../assets/tesseract-core',location.href).href,
   langPath:new URL('../assets/tessdata',location.href).href,
   gzip:true,cacheMethod:'write',workerBlobURL:false,
   logger:m=>say('Tesseract: '+m.status+' '+(m.progress==null?'':Math.round(m.progress*100)+'%')),
   errorHandler:e=>say('Worker error: '+(e?.message||e))
  });
  say('Worker ready');
  const result=await worker.recognize(img);
  say('RECOGNIZED: '+JSON.stringify(result.data.text));
  await worker.terminate();
  if(!/BULBASAUR/i.test(result.data.text)||!/67\s*\/\s*130/.test(result.data.text))throw new Error('OCR text did not match expected fixture');
  say('PASS');
 }catch(e){say('FAIL: '+(e?.stack||e));document.body.dataset.result='fail';return}
 document.body.dataset.result='pass';
})();
</script>
