name: Vendor offline scanner assets

on:
  workflow_dispatch:
  push:
    branches: [catalog-first-rebuild]
    paths:
      - ".github/workflows/vendor-scanner-assets.yml"
      - "src/card-vision.js"
      - "src/ocr-adapter.mjs"
      - "src/recognition-pipeline.mjs"

concurrency:
  group: repo-writer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-first-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download pinned OpenCV.js runtime
        run: |
          npm pack @techstark/opencv-js@5.0.0-release.1
          mkdir -p /tmp/opencv assets
          tar -xzf techstark-opencv-js-5.0.0-release.1.tgz -C /tmp/opencv
          cp /tmp/opencv/package/dist/opencv.js assets/opencv.js
      - name: Download pinned Tesseract.js runtime
        run: |
          mkdir -p assets/tesseract-core assets/tessdata /tmp/tesseract
          npm pack tesseract.js@7.0.0
          tar -xzf tesseract.js-7.0.0.tgz -C /tmp/tesseract
          cp /tmp/tesseract/package/dist/tesseract.min.js assets/tesseract.min.js
          cp /tmp/tesseract/package/dist/worker.min.js assets/worker.min.js
      - name: Download WebAssembly core
        run: |
          mkdir -p /tmp/tesseract-core
          npm pack tesseract.js-core@7.0.0
          tar -xzf tesseract.js-core-7.0.0.tgz -C /tmp/tesseract-core
          cp /tmp/tesseract-core/package/*.js assets/tesseract-core/
          cp /tmp/tesseract-core/package/*.wasm assets/tesseract-core/ 2>/dev/null || true
          ls -lh assets/tesseract-core/
      - name: Download English and Japanese OCR models
        run: |
          curl -fL https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o assets/tessdata/eng.traineddata.gz
          curl -fL https://tessdata.projectnaptha.com/4.0.0/jpn.traineddata.gz -o assets/tessdata/jpn.traineddata.gz
          ls -lh assets/tessdata/
      - name: Commit local scanner assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "Vendor offline OpenCV and English/Japanese OCR assets"
          git pull --rebase origin catalog-first-rebuild
          git push origin catalog-first-rebuild
