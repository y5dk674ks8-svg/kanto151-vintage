name: Build offline OCR assets
on:
  push:
    branches: [offline-scanner]
    paths:
      - '.github/workflows/offline-ocr-assets.yml'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-scanner
      - name: Download pinned Tesseract.js runtime
        run: |
          mkdir -p assets/tesseract-core assets/tessdata
          npm pack tesseract.js@5.1.1
          mkdir -p /tmp/tesseract
          tar -xzf tesseract.js-5.1.1.tgz -C /tmp/tesseract
          cp /tmp/tesseract/package/dist/tesseract.min.js assets/tesseract.min.js
          cp /tmp/tesseract/package/dist/worker.min.js assets/worker.min.js
      - name: Download WebAssembly core
        run: |
          npm pack tesseract.js-core@5.0.0
          mkdir -p /tmp/tesseract-core
          tar -xzf tesseract.js-core-5.0.0.tgz -C /tmp/tesseract-core
          cp /tmp/tesseract-core/package/tesseract-core.wasm.js assets/tesseract-core/
          cp /tmp/tesseract-core/package/tesseract-core-simd.wasm.js assets/tesseract-core/
          cp /tmp/tesseract-core/package/tesseract-core-lstm.wasm.js assets/tesseract-core/
          cp /tmp/tesseract-core/package/tesseract-core-simd-lstm.wasm.js assets/tesseract-core/
      - name: Download English OCR model
        run: curl -fL https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o assets/tessdata/eng.traineddata.gz
      - name: Commit local OCR runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "Vendor offline OCR runtime and English model"
          git push
