name: OCR browser smoke tests
on:
  push:
    branches: [offline-scanner]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/ocr-browser-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-scanner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
      - run: node tests/run-smoke.js
