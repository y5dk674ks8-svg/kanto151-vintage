name: Run Kanto 151 catalog audit

on:
  workflow_dispatch:
  push:
    branches: [catalog-first-rebuild]
    paths:
      - "tools/catalog-audit.mjs"
      - "catalog/pokemon-name-reference.json"
      - "catalog/card-record.schema.json"
      - "catalog/audit/japanese-vintage-set-reference.json"
      - "src/catalog-loader.mjs"
      - "src/recognition-pipeline.mjs"
      - "src/ocr-adapter.mjs"
      - "src/card-vision.js"
      - "src/visual-match.mjs"
      - "tests/catalog-loader.test.mjs"
      - "tests/recognition-pipeline.test.mjs"
      - "tests/catalog-data.test.mjs"
      - "tests/app-shell.test.mjs"
      - "tests/visual-match.test.mjs"
      - "index.html"
      - "sw.js"
      - ".github/workflows/catalog-audit.yml"

concurrency:
  group: repo-writer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-first-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test catalog loader and candidate ranking
        run: node --test tests/catalog-loader.test.mjs
      - name: Test recognition pipeline
        run: node --test tests/recognition-pipeline.test.mjs
      - name: Test scanner app shell
        run: node --test tests/app-shell.test.mjs
      - name: Test visual feature ranking
        run: node --test tests/visual-match.test.mjs
      - name: Run multilingual catalog audit
        run: node tools/catalog-audit.mjs
      - name: Validate generated catalog data
        run: node --test tests/catalog-data.test.mjs
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f catalog/cards.json ]; then git rm -f catalog/cards.json; fi
          git add catalog/cards/ catalog/index.json catalog/audit/
          git diff --cached --quiet || git commit -m "Generate English and Japanese Kanto catalog audit"
          for attempt in 1 2 3; do
            git fetch origin catalog-first-rebuild
            git rebase origin/catalog-first-rebuild
            if git push origin catalog-first-rebuild; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          exit 1
