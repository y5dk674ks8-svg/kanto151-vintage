name: Run Kanto 151 catalog audit

on:
  workflow_dispatch:
  push:
    branches: [catalog-first-rebuild]
    paths:
      - "tools/catalog-audit.mjs"
      - ".github/workflows/catalog-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-first-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run multilingual catalog audit
        run: node tools/catalog-audit.mjs
      - name: Commit audit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/cards.json catalog/audit/
          git diff --cached --quiet || git commit -m "Generate English and Japanese Kanto catalog audit"
          git push origin catalog-first-rebuild
