<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanto 151 – app verversen</title>
<body style="font:17px system-ui;padding:24px;line-height:1.5">
<h2>Kanto 151 wordt bijgewerkt…</h2><p id="status">Oude appcache wordt veilig verwijderd. Je collectiegegevens blijven behouden.</p>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(r=>new URL(r.scope).pathname.startsWith(location.pathname.replace(/[^/]*$/,''))).map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith('kanto151-')).map(k=>caches.delete(k)));
  }
  status.textContent='Oude appcache verwijderd. De nieuwe app wordt geopend…';
  location.replace('./?refresh=kanto151-20261127-08&reset=1');
 }catch(e){status.textContent='Automatisch verversen lukte niet: '+e.message+'. Sluit deze pagina en open de nieuwe testlink opnieuw.'}
})();
</script></body></html>
